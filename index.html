<html lang="zh-CN">

<title>小学加油站 · 幼小衔接每日学习</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe9ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小学加油站">

<style>
:root{--ink:#1d1b4d;--bg1:#bfe9ff;--bg2:#fff6d6;--org:#ff7a00;--grn:#19b36b;--blu:#2f7bff;--pnk:#ff5fa2;--pur:#8e5bff;--yel:#ffd23f;--red:#ff4d4f;--card:#ffffff;--line:#1d1b4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink);
 font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei","Source Han Sans SC",sans-serif;font-size:20px;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
#app{height:100dvh;max-width:520px;margin:0 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top) 12px calc(14px + env(safe-area-inset-bottom));position:relative}
button{font:inherit;color:var(--ink);cursor:pointer;border:4px solid var(--line);background:#fff;border-radius:22px;min-height:64px;padding:8px 16px;touch-action:manipulation;
 box-shadow:0 5px 0 var(--line);transition:transform .08s,box-shadow .08s}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--pur);outline-offset:2px}
.big{display:block;width:100%;min-height:78px;font-size:30px;font-weight:900;background:var(--org);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.big.grn{background:var(--grn)}.big.blu{background:var(--blu)}.big.pnk{background:var(--pnk)}
.hidden{display:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:900;font-size:22px;min-height:48px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 6px}
.gear{min-height:52px;min-width:64px;font-size:22px;padding:2px 8px;border-radius:16px;line-height:1.1;box-shadow:0 3px 0 var(--line)}
.gear small{display:block;font-size:13px;font-weight:700}
.card{background:var(--card);border:4px solid var(--line);border-radius:26px;padding:14px;margin:10px 0;box-shadow:0 5px 0 var(--line)}
.petcard{text-align:center;position:relative}
.pet{font-size:104px;line-height:1.1;min-height:130px;border:none;background:transparent;box-shadow:none;padding:0;width:100%}
.pet:active{transform:scale(.95)!important;box-shadow:none!important}
.pet.bounce{animation:bounce .6s}
.bubble{display:inline-block;background:#fff8dc;border:3px solid var(--line);border-radius:18px;padding:6px 14px;font-weight:800;font-size:20px;margin-bottom:6px;max-width:92%}
.xp{height:18px;border:3px solid var(--line);border-radius:12px;background:#eee;overflow:hidden;margin:8px 8px 2px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),var(--org));transition:width .6s}
.small{font-size:16px;font-weight:700;opacity:.85}
.dayno{font-size:38px;font-weight:900;color:var(--org)}
.theme{font-size:22px;font-weight:900}
.title{font-size:20px;font-weight:700;margin:4px 0 10px}
.lvdots{display:flex;gap:8px;justify-content:center;margin:8px 0 14px}
.lvdots span{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:22px;background:#fff}
.lvdots span.on{background:var(--grn);color:#fff}
.lvdots span.now{background:var(--yel);animation:pulse 1.2s infinite}
.navrow{display:flex;gap:10px;margin:10px 0}.navrow button{flex:1;font-size:22px;font-weight:800;min-height:72px}
.habit{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
.habit .chk{min-width:60px;min-height:60px;font-size:30px;padding:0;border-radius:16px}
.habit .chk.on{background:var(--grn);color:#fff}
.pwa{font-size:14px;opacity:.8;text-align:center;margin:8px 0 0}
.screen{padding-bottom:20px}
/* play */
.ptop{display:flex;align-items:center;gap:8px;padding:8px 0}
.homebtn{min-width:62px;min-height:56px;font-size:26px;padding:0;border-radius:16px;box-shadow:0 3px 0 var(--line)}
.lvname{flex:1;text-align:center;font-weight:900;font-size:20px;line-height:1.15}
.prog{height:16px;border:3px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;width:0;background:var(--grn);transition:width .4s}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-block;border:3px solid var(--line);border-radius:999px;padding:2px 14px;font-weight:900;font-size:18px;background:var(--yel)}
.chip.py{background:#ffb3d1}.chip.zi{background:#ffd23f}.chip.math{background:#9dd2ff}.chip.logic{background:#b8f0c8}.chip.poem{background:#d9c2ff}.chip.fun{background:#ffd9a8}
.sbtn{min-height:52px;font-size:19px;font-weight:800;padding:2px 14px;border-radius:16px;background:#e6f0ff;box-shadow:0 3px 0 var(--line)}
.prompt{font-size:30px;font-weight:900;line-height:1.3;text-align:center;margin:10px 0 6px}
.vis{text-align:center;margin:4px 0 8px;min-height:20px}
.retag{display:inline-block;font-size:16px;background:#fff;border:2px dashed var(--line);border-radius:10px;padding:0 8px;margin-left:6px}
.bigemo{font-size:96px;line-height:1.15}.bigemo svg{vertical-align:middle}
.rb{font-size:34px;font-weight:900;margin-top:2px}
.rb ruby{ruby-position:over;margin:0 3px}.rb rt{font-size:16px;font-weight:700;color:#5b3fd0}
.note{font-size:16px;font-weight:700;color:#5b3fd0;margin-top:4px}
.pybig{font-size:64px;font-weight:900;color:#5b3fd0;letter-spacing:2px}
.chbig{font-size:120px;font-weight:900;line-height:1.1;font-family:"Kaiti SC","STKaiti","Noto Serif CJK SC","Noto Sans CJK SC",serif}
.cz{font-size:56px;font-weight:900;font-family:"Kaiti SC","STKaiti","Noto Serif CJK SC","Noto Sans CJK SC",serif}
.pyt{font-size:30px;font-weight:900;color:#4a2fb0}
.pl{font-size:28px;font-weight:900}
.wd{font-size:30px;font-weight:900}.wd rt{font-size:13px;color:#5b3fd0;font-weight:700}
.emo{font-size:60px;line-height:1.1}
.sym{font-size:56px;font-weight:900}
.seq{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:6px 0}
.seq b{min-width:64px;height:64px;padding:0 6px;border:4px solid var(--line);border-radius:16px;background:#fff;font-size:40px;line-height:56px;text-align:center}
.seq b.q{background:var(--yel);color:#c24100}
.seq.pat b{font-size:34px;min-width:56px;height:60px;line-height:50px}
.eq{font-size:46px;font-weight:900;margin:6px 0}.eq .q{display:inline-block;min-width:60px;border-bottom:6px solid var(--org);color:var(--org)}
.eg{display:inline-block}.eg .er{display:flex;justify-content:center;gap:4px;font-size:44px;line-height:1.15}.eg-s .er{font-size:34px}
.addv{display:flex;align-items:center;justify-content:center;gap:8px}.addv i{font-style:normal;font-size:44px;font-weight:900}
.addv .er{font-size:34px}
.two{display:flex;align-items:center;justify-content:center;gap:6px}.two .vs{font-weight:900;font-size:20px}.two .er{font-size:30px}
.tf{display:grid;grid-template-columns:repeat(5,44px);gap:4px;justify-content:center;margin:4px auto}
.tf i{display:block;width:44px;height:44px;border:3px solid var(--line);border-radius:10px;background:#fff}.tf i.on{background:var(--red)}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;max-width:360px;margin:0 auto}
.dot{display:inline-block;width:34px;height:34px;border-radius:50%;border:3px solid var(--line);background:#fff}.dot.d1{background:var(--red)}.dot.d2{background:#fff}
.shapes{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.posh,.posv{display:flex;gap:30px;justify-content:center;font-size:80px;line-height:1.1}.posv{flex-direction:column;align-items:center;gap:8px}
.tens{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:flex-end;max-width:360px;margin:0 auto}
.tens .bar{width:20px;height:80px;background:var(--blu);border:3px solid var(--line);border-radius:6px}.tens .one{width:20px;height:20px;background:var(--org);border:3px solid var(--line);border-radius:4px}
.spell{font-size:60px;font-weight:900}.spell i{font-style:normal;margin:0 10px;color:var(--org)}.spell b{color:#4a2fb0}
.poemline{font-size:54px;font-weight:900;letter-spacing:6px;font-family:"Kaiti SC","STKaiti","Noto Serif CJK SC","Noto Sans CJK SC",serif}
.blank{display:inline-block;min-width:56px;border-bottom:6px solid var(--org);color:var(--org);text-align:center}
.opts{display:grid;gap:12px;margin:10px 0}
.opts.c1{grid-template-columns:1fr}.opts.c2{grid-template-columns:1fr 1fr}.opts.c3{grid-template-columns:1fr 1fr 1fr}.opts.c4{grid-template-columns:repeat(4,1fr)}
.opt{min-height:82px;font-size:40px;font-weight:900;border-radius:24px;background:#fff;padding:6px 8px;word-break:keep-all}
.opts.c3 .opt{font-size:38px}
.opt.opt-emo{min-height:100px}.opt.opt-grp{min-height:90px}
.opt.opt-cell{min-height:0;aspect-ratio:1;padding:2px;border-radius:16px;box-shadow:0 3px 0 var(--line);border-width:3px}.opt.opt-cell .emo{font-size:42px}
.opts.c4 .opt.opt-cell .emo{font-size:34px}
.opt.right{background:#b6f5c9;border-color:#0b8a4a;box-shadow:0 5px 0 #0b8a4a;animation:pop .45s}
.opt.wrong{background:#ffe3c2;border-color:#d96a00;box-shadow:0 5px 0 #d96a00;animation:shake .4s;opacity:.7}
.opt.hint{animation:pulse .9s infinite;border-color:#0b8a4a}
.fb{min-height:62px;text-align:center;font-size:24px;font-weight:900;padding:6px 4px}
.fb.ok{color:#0b8a4a}.fb.no{color:#b45300}
.fb small{display:block;font-size:17px;font-weight:700;color:var(--ink)}
.bottombar{position:sticky;bottom:0;padding:8px 0 4px;background:linear-gradient(180deg,transparent,var(--bg2) 40%)}
/* match / order */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}.match .col{display:grid;gap:12px}
.mt{min-height:92px;font-size:34px;font-weight:900;border-radius:20px;padding:4px}
.mt.sel{background:var(--yel);transform:scale(1.03)}.mt.done{background:#b6f5c9;border-color:#0b8a4a;box-shadow:none;opacity:.85}.mt.bad{animation:shake .4s;background:#ffe3c2}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.slot{min-width:64px;height:70px;border:4px dashed var(--line);border-radius:16px;font-size:38px;font-weight:900;display:flex;align-items:center;justify-content:center;background:#fff9}
.slot.full{border-style:solid;background:#b6f5c9}
.tiles{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.tile{min-width:92px;min-height:92px;font-size:46px;font-weight:900;border-radius:22px}.tile.used{visibility:hidden}.tile.bad{animation:shake .4s;background:#ffe3c2}
/* trace */
.tracewrap{display:flex;flex-direction:column;align-items:center;gap:8px}
#tc{width:min(86vw,340px);height:min(86vw,340px);background:#fffdf3;border:4px solid var(--line);border-radius:22px;touch-action:none;box-shadow:0 5px 0 var(--line)}
.stname{font-size:26px;font-weight:900;min-height:36px}
.row2{display:flex;gap:10px;width:100%}.row2 button{flex:1;font-size:20px;font-weight:800;min-height:60px}
/* memory */
.mem{display:grid;gap:10px;margin:10px 0}.mem.c3{grid-template-columns:repeat(3,1fr)}.mem.c4{grid-template-columns:repeat(4,1fr)}
.mc{aspect-ratio:1;min-height:0;font-size:44px;padding:0;border-radius:18px;background:var(--blu);color:#fff;box-shadow:0 4px 0 var(--line)}
.mem.c4 .mc{font-size:36px}
.mc.up{background:#fff}.mc.ok{background:#b6f5c9;border-color:#0b8a4a;box-shadow:none}
/* maze */
.maze{display:grid;border:5px solid var(--line);border-radius:12px;margin:6px auto;background:#fffbe6;width:min(88vw,360px);aspect-ratio:1}
.mz{position:relative;display:flex;align-items:center;justify-content:center;font-size:min(8vw,32px);border:0 solid var(--line);cursor:pointer}
.mz.bn{border-top-width:4px}.mz.be{border-right-width:4px}.mz.bs{border-bottom-width:4px}.mz.bw{border-left-width:4px}
.mz.vis{background:#d7f5e1}
.dpad{display:grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(2,72px);gap:6px;justify-content:center;margin:10px 0}
.dpad button{min-height:0;font-size:34px;padding:0;border-radius:18px}.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.mz-shake{animation:shake .3s}
/* learn */
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.lcard{min-height:150px;padding:8px;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.lcard .lb{font-size:62px;font-weight:900;color:#4a2fb0;line-height:1}.lcard .lb.ch{font-family:"Kaiti SC","STKaiti","Noto Serif CJK SC","Noto Sans CJK SC",serif;color:var(--ink);font-size:72px}
.lcard .le{font-size:46px}.lcard .lw{font-size:20px;font-weight:800}.lcard .lw rt{font-size:12px}
.lcard.tap{animation:bounce .5s}
.scene{font-size:80px;margin:10px 0}.sent{font-size:34px;font-weight:900;line-height:1.7}.sent ruby{ruby-position:over;margin:0 2px}.sent rt{font-size:15px;color:#5b3fd0}
.poemc{background:#fffdf0;border:4px solid var(--line);border-radius:22px;padding:10px;text-align:center}.poemc .pt{font-size:30px;font-weight:900}
.poemc .pa{font-size:18px;font-weight:700;margin-bottom:6px}.poemc .pln{font-size:34px;font-weight:900;line-height:1.9;font-family:"Kaiti SC","STKaiti","Noto Serif CJK SC","Noto Sans CJK SC",serif}
.poemc ruby{ruby-position:over;margin:0 2px}.poemc rt{font-size:15px;font-family:system-ui,sans-serif;color:#5b3fd0}
/* done / rest */
.center{text-align:center}.hero{font-size:100px;line-height:1.1}.h1{font-size:34px;font-weight:900;margin:6px 0}
.breath{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fff,#9dd2ff);border:5px solid var(--line);margin:14px auto;animation:breathe 4s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:56px}
.rest{font-size:22px;font-weight:800;background:#fff;border:3px dashed var(--line);border-radius:18px;padding:10px}
.stickerbig{font-size:150px;animation:spin 1.2s ease-out;display:inline-block}
.confetti{position:fixed;left:0;top:0;width:100%;height:0;pointer-events:none;z-index:50}
.confetti span{position:absolute;top:-40px;font-size:30px;animation:fall 2.4s linear forwards}
.floatstar{position:fixed;left:50%;top:38%;font-size:44px;font-weight:900;transform:translateX(-50%);pointer-events:none;z-index:60;animation:floatup 1s ease-out forwards;color:var(--org);text-shadow:0 2px 0 #fff}
/* map & stickers */
.weekh{font-weight:900;font-size:20px;margin:12px 0 6px}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dbtn{min-height:78px;padding:4px;font-size:22px;font-weight:900;border-radius:18px;line-height:1.1;box-shadow:0 3px 0 var(--line)}
.dbtn small{display:block;font-size:13px;font-weight:700}
.dbtn.done{background:#b6f5c9}.dbtn.cur{background:var(--yel);animation:pulse 1.3s infinite}.dbtn.lock{background:#e4e4ee;color:#7a7a98}
.dbtn.rv{border-style:dashed}
.stk{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sk{min-height:0;aspect-ratio:1;padding:0;font-size:36px;border-radius:16px;border-width:3px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.sk small{font-size:11px;font-weight:700;margin-top:2px}.sk.lock{background:#e4e4ee;color:#9a9ab8}.sk.lock span{filter:grayscale(1) brightness(.5) opacity(.5)}
.backrow{display:flex;gap:10px;align-items:center;padding:10px 0}.backrow button{min-width:70px;font-size:24px}.backrow h2{margin:0;font-size:26px}
/* parent */
.pcard h3{margin:0 0 8px;font-size:22px}.pcard{font-size:18px;font-weight:600}
.seg{display:flex;gap:8px}.seg button{flex:1;font-size:19px;font-weight:800;min-height:56px;padding:4px}.seg button.on{background:var(--blu);color:#fff}
.bar{height:22px;border:3px solid var(--line);border-radius:12px;background:#eee;overflow:hidden;margin:2px 0 8px}.bar i{display:block;height:100%;background:var(--grn)}
.tbl{width:100%;border-collapse:collapse;font-size:16px}.tbl td,.tbl th{border-bottom:1px solid #ccd;padding:4px 3px;text-align:center}
select,input[type=text],input[type=tel],textarea{font:inherit;font-size:20px;border:3px solid var(--line);border-radius:14px;padding:8px;width:100%;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
textarea{min-height:110px;font-size:14px;font-family:monospace}
.pbtn{font-size:19px;font-weight:800;min-height:56px;margin:4px 4px 4px 0}
.msg{font-size:16px;font-weight:700;color:#b45300;min-height:22px}
/* modal */
.modalbg{position:fixed;inset:0;background:rgba(29,27,77,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border:5px solid var(--line);border-radius:28px;padding:18px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 0 var(--line)}
.modal .h1{font-size:28px}.modal .row2{margin-top:12px}.modal .row2 button{font-size:24px;min-height:70px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:800;font-size:18px;z-index:200;max-width:90%;text-align:center}
.no-tts .tts,.ifnotts{display:none}
.no-tts .ifnotts{display:block}
@keyframes bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-22px) scale(1.06)}60%{transform:translateY(0) scale(.97)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px) scale(1.2)}}
@keyframes breathe{0%,100%{transform:scale(.8)}50%{transform:scale(1.15)}}
@keyframes spin{0%{transform:scale(0) rotate(-360deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-height:700px){.bigemo{font-size:70px}.prompt{font-size:26px}.pet{font-size:80px;min-height:100px}}
.bottombar:has(#nx.hidden){display:none}

/* ===== v2: 凑十 / 十加几 / 整十数 图示 ===== */
.tf i.g{background:#19b36b}.tf i.q{background:#fff3b0;border-style:dashed;animation:pulse 1.1s infinite}
.dot.d3{background:var(--blu)}.dot.hol{background:#fff}
.loose{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:300px;margin:2px auto}
.loose .dot{width:30px;height:30px}
.cv{display:flex;flex-direction:column;align-items:center;gap:0;margin:2px auto}

.rods{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-items:flex-end;max-width:150px}
.rods small{flex-basis:100%;text-align:center;font-size:15px;font-weight:800}
.rod{display:inline-flex;align-items:center;justify-content:center;width:26px;height:54px;border:3px solid var(--line);border-radius:6px;font-style:normal;font-size:12px;font-weight:900;color:#fff;background:var(--blu)}

.tens .one.o2{background:var(--pnk)}

.gwork{min-height:34px;text-align:center;font-size:26px;font-weight:900;color:#4a2fb0}.gwork div{line-height:1.25}
.gdots{text-align:center;font-size:18px;font-weight:800;margin:2px 0}.gdots b{display:inline-block;min-width:30px;height:30px;line-height:24px;border:3px solid var(--line);border-radius:50%;background:#fff;margin:0 3px}.gdots b.on{background:var(--yel)}.gdots b.dn{background:#b6f5c9}
.gq{font-size:27px;font-weight:900;text-align:center;margin:4px 0}
.gstep .opt{min-height:70px;font-size:36px}
.gres{font-size:40px;font-weight:900;color:#0b8a4a;text-align:center}

.acard .aletter small{font-size:62px;color:var(--org);margin-left:6px}

  const f=mulberry32(hashStr(String(seed)));
  const r={f};
  r.int=(a,b)=>a+Math.floor(f()*(b-a+1));
  r.pick=arr=>arr[Math.floor(f()*arr.length)];
  r.shuffle=arr=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
  r.sample=(arr,n)=>r.shuffle(arr).slice(0,n);
  r.chance=p=>f()<p;
  r.wpick=(arr,wf)=>{let tot=0;const w=arr.map(x=>{const v=Math.max(0,wf(x));tot+=v;return v;});if(tot<=0)return arr[Math.floor(f()*arr.length)];let x=f()*tot;for(let i=0;i<arr.length;i++){x-=w[i];if(x<0)return arr[i];}return arr[arr.length-1];};

function genMaze(w,h,R){
  const N=1,E=2,S=4,W=8,cells=new Array(w*h).fill(0),seen=new Array(w*h).fill(false),stack=[0];seen[0]=true;

/* ================= 英语:26 个字母 =================
 * 题型:字母卡(abc) / 跟读(follow) / 听音选字母 / 大小写选择 / 大小写配对 / 找不同 / 字母顺序 / 看图选首字母 */
const LTR_BY={};LETTERS.forEach(x=>{LTR_BY[x.u]=x;});
const SIM_GROUPS=[['b','d','p','q'],['m','n','h','u','r'],['i','j','l','t'],['a','e','o','c','s'],['g','q','y'],['u','v','w'],['f','t'],['k','x','z'],
  ['B','D','P','R'],['E','F'],['M','W','N'],['O','Q','C','G'],['I','J','L','T'],['U','V','Y'],['K','X','Y'],['S','Z']];
const DIFF_PAIRS_L=[['b','d'],['p','q'],['b','p'],['d','q'],['m','n'],['n','u'],['i','j'],['a','e'],['n','h'],['u','v'],['f','t'],['g','q'],['v','w'],['c','o'],
  ['E','F'],['M','W'],['O','Q'],['P','R'],['I','J'],['U','V'],['C','G'],['B','D']];
function ltrSpan(ch,cls){return '<span class="ltr'+(cls?' '+cls:'')+'">'+ch+'</span>';}
function ltrOpt(ch){return {k:ch,h:ltrSpan(ch)};}
function knownSet(c){return new Set(c.spec.knownLtr);}
function ltrWeight(c,u){
  const s=c.spec;let w=1;
  if(s.newLtr.includes(u))w+=4;
  if(s.reLtr.includes(u))w+=3.5;
  if(s.type!=='learn'&&s.weekLtr.includes(u))w+=2.5;
  const lo=u.toLowerCase(),ks=knownSet(c);
  if(SIM_GROUPS.some(g=>(g.includes(lo)||g.includes(u))&&g.some(x=>x!==lo&&x!==u&&ks.has(x.toUpperCase()))))w+=1.2; // 易混字母多出现
  return w;
}
function ltrPick(c,filter){
  const list=c.spec.knownLtr.filter(u=>!filter||filter(u));
  return c.R.wpick(list.map(u=>[u,ltrWeight(c,u)]),x=>x[1])[0];
}
/* 干扰项:先放长得像的(已学过的),再放其他已学字母;avoid 里的字符不出现 */
function ltrWrongs(c,u,lower,avoid){
  const R=c.R,ks=knownSet(c),ch=lower?u.toLowerCase():u,out=[],av=avoid||[];
  const add=x=>{if(x!==ch&&!out.includes(x)&&!av.includes(x))out.push(x);};
  const sims=[];SIM_GROUPS.forEach(g=>{if(g.includes(ch))g.forEach(x=>{if(ks.has(x.toUpperCase()))sims.push(x);});});
  R.shuffle(sims).forEach(add);
  R.shuffle(c.spec.knownLtr.map(x=>lower?x.toLowerCase():x)).forEach(add);
  if(out.length<3)R.shuffle(LETTERS.map(x=>lower?x.l:x.u)).forEach(add);
  return out;
}
function fbSpeak(L){return '请爸爸妈妈读「'+L.say+'」('+L.ipa+')';}

/* ---------- 字母卡 ---------- */
function ltrCard(c,letters,title,re){
  const items=letters.map(u=>{const L=LTR_BY[u];return {u:L.u,l:L.l,w:L.w,zh:L.zh,emo:L.e,say:L.say,ipa:L.ipa,ph:L.ph,note:L.note||''};});
  const tip=re?(LTR_TIPS[letters.join('')]||'看一看,它们的样子有什么不一样?'):'';
  return {kind:'abc',subject:'en',title,items,re:!!re,tip,lang:'en',key:(re?'abr|':'abc|')+letters.join('')};
}
/* ---------- 跟读 ---------- */
function gLtrFollow(c){
  const pool=[];c.spec.knownLtr.forEach(u=>{const n=Math.max(1,Math.round(ltrWeight(c,u)));for(let i=0;i<n;i++)pool.push(u);});
  return {kind:'follow',subject:'en',prompt:'跟读小达人',pool,need:4,lang:'en',key:'follow|'+c.cday};
}
/* ---------- 听音选字母 ---------- */
function gLtrListen(c){
  const R=c.R,t=ltrPick(c),L=LTR_BY[t];
  const lower=c.diff===0?false:R.chance(c.diff===2?.6:.4),sh=lower?L.l:L.u;
  return mkChoice(c,{subject:'en',topic:'ltrlisten',lang:'en',prompt:'听一听,这是哪个字母?',say:L.say,
    vis:'<div class="bigemo">🔊</div><div class="ifnotts note">这台设备不能朗读:'+fbSpeak(L)+'</div>',
    correct:ltrOpt(sh),wrongs:ltrWrongs(c,t,lower).map(ltrOpt),keepOrder:true,cols:c.nopt>3?2:3,optCls:'opt-ltr',
    hint:'再点一次 🔊 听一听,想想字母的样子~',meta:{type:'ltrlisten',ans:t,shown:sh,say:L.say},key:'ll|'+sh});
}
/* ---------- 大小写(选) ---------- */
function gLtrCase(c){
  const R=c.R,t=ltrPick(c),L=LTR_BY[t],ul=R.chance(.5);
  const ans=ul?L.l:L.u,avoid=ul?(t==='I'?['l']:[]):(t==='L'?['I']:[]);
  return mkChoice(c,{subject:'en',topic:'ltrcase',prompt:ul?'大写字母,它的小写是哪个?':'小写字母,它的大写是哪个?',say:'',
    vis:'<div class="ltrbig">'+ltrSpan(ul?L.u:L.l,'xl')+'</div>',correct:ltrOpt(ans),wrongs:ltrWrongs(c,t,ul,avoid).map(ltrOpt),keepOrder:true,
    cols:c.nopt>3?2:3,optCls:'opt-ltr',hint:'大写和小写是一对好朋友,看看它们的样子~',
    meta:{type:'ltrcase',up:L.u,low:L.l,dir:ul?'ul':'lu',ans},key:'lc|'+t+(ul?'u':'l')});
}
/* ---------- 大小写配对 ---------- */
function gLtrMatch(c){
  const R=c.R,ks=c.spec.knownLtr,first=ltrPick(c),set=[first];
  const ok=u=>!set.includes(u)&&!((u==='I'&&set.includes('L'))||(u==='L'&&set.includes('I')));
  // 优先配一个长得像的字母(如 b 和 d),练习分辨
  const lo=first.toLowerCase(),sims=[];
  SIM_GROUPS.forEach(g=>{if(g.includes(lo)||g.includes(first))g.forEach(x=>{const u=x.toUpperCase();if(ks.includes(u)&&ok(u)&&!sims.includes(u))sims.push(u);});});
  if(sims.length&&R.chance(.7))set.push(R.pick(sims));
  while(set.length<3){const u=ltrPick(c,ok);if(!u||!ok(u))break;set.push(u);}
  if(set.length<2){return gLtrCase(c);}
  const ps=R.shuffle(set);
  return {kind:'match',subject:'en',topic:'ltrmatch',prompt:'连一连:大写和小写是好朋友',say:'',
    pairs:ps.map((u,i)=>({id:i,l:ltrSpan(u),r:ltrSpan(u.toLowerCase())})),
    key:'lm|'+set.slice().sort().join(''),meta:{type:'ltrmatch',pairs:ps.map(u=>[u,u.toLowerCase()])}};
}
/* ---------- 找出不同的字母 ---------- */
function gLtrDiff(c){
  const R=c.R,ks=knownSet(c),total=c.diff===0?6:(c.diff===1?9:12);
  let cands=DIFF_PAIRS_L.filter(p=>p.every(x=>ks.has(x.toUpperCase())));
  let a,b;
  if(cands.length&&(c.spec.knownLtr.length>=6?true:false)){
    // 易混的字母对:当天新字母或本周重点的优先
    const ws=cands.map(p=>[p,1+p.reduce((s,x)=>s+(c.spec.newLtr.includes(x.toUpperCase())||c.spec.reLtr.includes(x.toUpperCase())?3:0),0)]);
    [a,b]=R.wpick(ws,x=>x[1])[0];
  }else{
    const lst=c.spec.knownLtr;const x=R.pick(lst);let y=R.pick(lst.filter(z=>z!==x));
    if(!y)y=x==='A'?'B':'A';
    const lower=c.diff>0&&R.chance(.5);a=lower?x.toLowerCase():x;b=lower?y.toLowerCase():y;
  }
  if(R.chance(.5)){const t=a;a=b;b=t;}
  const odd=R.int(0,total-1),opts=[];
  for(let i=0;i<total;i++)opts.push({k:String(i),h:ltrSpan(i===odd?b:a),ok:i===odd});
  return {kind:'choice',subject:'en',topic:'ltrdiff',prompt:'找出不一样的字母',say:'',vis:'',opts,cols:3,fixed:true,dupOK:true,optCls:'opt-ltr opt-cell',
    hint:'仔细看,有一个字母的方向或样子不一样~',ok:true,
    meta:{type:'ltrdiff',total,odd,base:a,diff:b},key:'ld|'+a+b+'|'+odd+'|'+total+'|'+c.idx};
}
/* ---------- 字母顺序 ---------- */
function gLtrSeq(c){
  const R=c.R,ks=c.spec.knownLtr,len=c.diff===0?4:5;
  const letters=LETTERS.map(x=>x.u);
  let t=ltrPick(c,u=>{const i=letters.indexOf(u);return i>=1&&i<=24;}); // 不放在最前最后
  if(!t)t=R.pick(ks.filter(u=>u!=='A'&&u!=='Z'))||'B';
  const ti=letters.indexOf(t);
  // 序列长度 len,t 不在首尾
  const minStart=Math.max(0,ti-len+2),maxStart=Math.min(26-len,ti-1);
  const start=R.int(minStart,Math.max(minStart,maxStart)),lower=c.diff>0&&R.chance(.5);
  const seq=[];for(let i=0;i<len;i++){const ch=letters[start+i];seq.push(lower?ch.toLowerCase():ch);}
  const bi=ti-start,ans=seq[bi],shown=seq.slice();shown[bi]='?';
  const used=new Set(seq);
  const near=[];[-2,-1,1,2,3,-3].forEach(d=>{const j=ti+d;if(j>=0&&j<26){const ch=lower?letters[j].toLowerCase():letters[j];if(!used.has(ch)&&!near.includes(ch))near.push(ch);}});
  const wr=R.shuffle(near).slice(0,5);
  ltrWrongs(c,t,lower).forEach(x=>{if(!used.has(x)&&!wr.includes(x)&&wr.length<5)wr.push(x);});
  return mkChoice(c,{subject:'en',topic:'ltrseq',prompt:'补上缺的字母',say:'',
    vis:'<div class="seq lseq">'+shown.map(x=>x==='?'?'<b class="q">?</b>':'<b>'+x+'</b>').join('')+'</div>',
    correct:ltrOpt(ans),wrongs:wr.map(ltrOpt),cols:c.nopt>3?2:3,optCls:'opt-ltr',hint:'照着字母歌的顺序,一个一个念~',
    meta:{type:'ltrseq',seq,blank:bi,ans},key:'lq|'+seq.join('')});
}
/* ---------- 看图选首字母 ---------- */
function gLtrPic(c){
  const R=c.R,t=ltrPick(c,u=>LTR_BY[u].ini!==false),L=LTR_BY[t];
  return mkChoice(c,{subject:'en',topic:'ltrpic',lang:'en',prompt:L.w+' 的第一个字母是?',say:L.w,
    vis:'<div class="bigemo">'+L.e+'</div><div class="note">'+L.w+' · '+L.zh+'</div>',
    correct:ltrOpt(L.u),wrongs:ltrWrongs(c,t,false).map(ltrOpt),keepOrder:true,cols:c.nopt>3?2:3,optCls:'opt-ltr',
    hint:'读一读 '+L.w+',开头是 '+L.u+' '+L.l+'~',meta:{type:'ltrpic',word:L.w,ans:L.u},key:'lp|'+t});
}
/* ---------- 字母关 ---------- */
function blockLetter(c,n){
  const s=c.spec,items=[];
  if(s.type==='learn'&&s.newLtr.length)items.push(ltrCard(c,s.newLtr,'今天认识新字母',false));
  else if(s.type==='learn'&&s.reLtr.length)items.push(ltrCard(c,s.reLtr,'再认一认,这些字母容易混',true));
  const f=gLtrFollow(c);c.used.add(f.key);items.push(f);
  const d=c.cday,nk=s.knownLtr.length;
  const gens=[[gLtrListen,3],[gLtrCase,1.8],[gLtrMatch,1.4],[gLtrDiff,nk>=2?2.4:0],[gLtrSeq,nk>=3?1.6:0],[gLtrPic,1.6]].filter(x=>x[1]>0);
  fill(c,n-items.length,gens).forEach(x=>items.push(x));
  return items;
}
/* 字母名认读关的"第一小段"(先认字母名,再接拼读关):卡 → 跟读 → 小游戏 */

/* ================= 自然拼读:卡片 + 找拼读 =================
 * 题型:
 *  phon      字母发音卡(大卡片 + 慢速拼读 + 再慢一点 + 再听一次 + 跟读)
 *  phfind    听音选字母(听拼读 → 在 3–4 个字母里选)
 *  phpic     看字母选图(字母 → 哪个图片的名字以这个音开头)
 * 答错:温柔提示 + 慢速再读一遍;易混字母(b/d/p/q、m/n、c/k、a/e/i)多出现。 */
function phOf(u){return PHONICS[u.toLowerCase()];}
function phSameSound(a,b){a=a.toLowerCase();b=b.toLowerCase();return a===b||PHON_SAME.some(g=>g.includes(a)&&g.includes(b));}
function phConfWith(c,u){
  const lo=u.toLowerCase(),ks=knownSet(c),out=[];
  PHON_CONF.forEach(g=>{if(g.includes(lo))g.forEach(x=>{if(x!==lo&&ks.has(x.toUpperCase())&&!out.includes(x.toUpperCase()))out.push(x.toUpperCase());});});
  return out;
}
function phWeight(c,u){return ltrWeight(c,u)+(phConfWith(c,u).length?1.6:0);}
function phPick(c,filter){
  const list=c.spec.knownLtr.filter(u=>!filter||filter(u));
  if(!list.length)return null;
  return c.R.wpick(list.map(u=>[u,phWeight(c,u)]),x=>x[1])[0];
}
/* 图片题里,名字开头听起来像的也不能同时出现(queen 开头 /kw/ 和 cat/key 的 /k/ 太像) */
const PHON_START_LIKE=[['c','k','q']];
function phWrongs(c,t,pred,pic){
  const R=c.R,ks=c.spec.knownLtr,out=[];
  const like=u=>pic&&PHON_START_LIKE.some(g=>g.includes(u.toLowerCase())&&g.includes(t.toLowerCase()));
  const add=u=>{if(!phSameSound(u,t)&&!like(u)&&!out.includes(u)&&(!pred||pred(u)))out.push(u);};
  R.shuffle(phConfWith(c,t)).forEach(add);
  R.shuffle(ks).forEach(add);
  if(out.length<3)R.shuffle(LETTERS.map(x=>x.u)).forEach(add);
  return out;
}
/* ---------- 发音卡 ---------- */
function gPhonCard(c,u,re){
  return {kind:'phon',subject:'en',u,re:!!re,title:re?'再听一听拼读':'认识字母的声音',lang:'en',key:'phc|'+u};
}
function esc2(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
/* ---------- 听音选字母 ---------- */
function gPhonFind(c){
  const R=c.R,t=phPick(c),L=LTR_BY[t],P=phOf(t);
  const mode=c.diff===0?'both':(R.chance(c.diff===2?.8:.65)?'low':'up');
  const sh=u=>{const x=LTR_BY[u];return mode==='both'?x.u+x.l:(mode==='low'?x.l:x.u);};
  const wr=phWrongs(c,t);
  const it=mkChoice(c,{subject:'en',topic:'phfind',lang:'en',prompt:'听一听,哪个字母发这个音?',say:'',
    vis:'<div class="bigemo">🔊</div><div class="ifnotts note">这台设备不能朗读:请爸爸妈妈读 '+esc2(P.sym)+'('+esc2(P.cn)+')</div>',
    correct:{k:t,h:ltrSpan(sh(t))},wrongs:wr.map(u=>({k:u,h:ltrSpan(sh(u))})),keepOrder:true,cols:c.nopt>3?2:3,optCls:'opt-ltr',
    hint:'再听一次,轻轻跟着读。'+L.u+' '+L.l+' 的声音是 '+P.sym+'。',meta:{type:'phfind',ans:t,sym:P.sym,mode},key:'pf|'+t+'|'+mode});
  it.phon=t;return it;
}
/* ---------- 看字母选图片 ---------- */
function gPhonPic(c){
  const R=c.R,t=phPick(c),L=LTR_BY[t],P=phOf(t);
  const picOpt=u=>{const x=LTR_BY[u];return {k:u,h:'<span class="pic">'+x.e+'</span><small>'+x.w+'</small>'};};
  // 干扰图:不能是同音字母,也不能是"结尾才有这个音"的图(如 fox 对 f)
  const wr=phWrongs(c,t,u=>LTR_BY[u].ini!==false,true);
  const end=L.ini===false;
  const it=mkChoice(c,{subject:'en',topic:'phpic',lang:'en',prompt:end?'哪个图片的名字,最后有这个音?':'哪个图片的名字,是用这个音开头的?',say:'',
    vis:'<div class="ltrbig">'+ltrSpan(L.u+' '+L.l,'xl')+'</div><div class="note">'+esc2(P.sym)+'</div><div class="ifnotts note">'+esc2(P.cn)+'</div>',
    correct:picOpt(t),wrongs:wr.map(picOpt),keepOrder:true,cols:2,optCls:'opt-pic',
    hint:'点 🔊 再听一次,'+L.u+' '+L.l+' 的声音是 '+P.sym+',像 '+L.w+(end?' 的结尾':' 的开头')+'。',meta:{type:'phpic',ans:t,sym:P.sym},key:'pp|'+t});
  it.phon=t;return it;
}
/* ---------- 拼读关:先发音卡,再找拼读 ---------- */
function blockPhonics(c,n){
  const s=c.spec,items=[];
  let cards=[];
  if(s.type==='learn'&&s.newLtr.length)cards=s.newLtr.slice(0,3).map(u=>gPhonCard(c,u,false));
  else{const u=phPick(c);if(u)cards=[gPhonCard(c,u,true)];}      // 复习/没有新字母:随机抽一个字母,先听它的声音
  cards.filter(x=>!c.used.has(x.key)).slice(0,Math.max(1,n-2)).forEach(x=>{c.used.add(x.key);items.push(x);});
  const nk=s.knownLtr.length;
  const gens=[[gPhonFind,3],[gPhonPic,nk>=3?2.2:1]];
  // 每个拼读关至少有 1 道"听音选字母"和(够位置时)1 道"看字母选图"
  fill(c,Math.min(1,n-items.length),[[gPhonFind,1]]).forEach(x=>items.push(x));
  if(n-items.length>=2)fill(c,1,[[gPhonPic,1]]).forEach(x=>items.push(x));
  fill(c,n-items.length,gens).forEach(x=>items.push(x));
  return items;
}

/* ================= 写数字 & 认数字 =================
 * 题型:learn(数字卡) / trace(描数字,和汉字描红同一引擎) / 数一数选数字 / 数字大写读法 / 后面是几 / 补数 / 连一连 / 哪个写对了 */
function digWeight(c,d){
  const s=c.spec;let w=1;
  if(s.newDig.includes(d))w+=4;
  if(s.reDig.includes(d))w+=3;
  if(['6','9','2','5','12','21','16','19','10','20'].includes(d)&&s.knownDig.includes(d))w+=0.6; // 容易写反/写混的数字多练一点
  return w;
}
function digPick(c,filter){
  const list=c.spec.knownDig.filter(d=>!filter||filter(d));
  if(!list.length)return null;
  return c.R.wpick(list.map(d=>[d,digWeight(c,d)]),x=>x[1])[0];
}
function digCard(c){
  const s=c.spec;if(!s.newDig.length)return null;
  return {kind:'learn',subject:'num',title:'今天认识、书写新数字',items:s.newDig.map(d=>{const n=+d;return {big:d,sub:numZh(n),emo:(n>=1&&n<=5?DIGIT_EMO[n].repeat(n):DIGIT_EMO[n]),say:numZh(n)};}),key:'dl|'+s.newDig.join(',')};
}
function gDigTrace(c,ch){
  const n=+ch;
  return {kind:'trace',subject:'num',num:true,ch,key:'dt|'+ch,prompt:'跟着小圆点,一笔一笔写数字「'+ch+'」',say:'写数字'+numZh(n)};
}
const DIG_MIRROR=['2','3','4','5','6','7','9'];
function gDigCount(c){
  const R=c.R,nums=c.spec.knownDig.map(Number).filter(n=>n>=1);if(!nums.length)return null;
  const d=R.wpick(nums.map(n=>[String(n),digWeight(c,String(n))]),x=>x[1])[0],n=+d,em=R.pick(OBJ_EMO),hi=Math.min(20,Math.max(9,n+3));
  return mkChoice(c,numOpts(c,n,0,hi,{subject:'num',topic:'dcount',prompt:'数一数,一共有几个?',say:'数一数,一共有几个?',vis:emoGrid(em,n,n>10?10:5),
    hint:'一个一个指着数,数到最后一个就是答案~',meta:{type:'dcount',ans:n},key:'dc|'+n+em}));
}
function gDigZh(c){
  const R=c.R,d=digPick(c,x=>+x>=1);if(!d)return null;const n=+d,hi=Math.min(20,Math.max(9,n+3));
  return mkChoice(c,numOpts(c,n,0,hi,{subject:'num',topic:'dzh',prompt:'「'+numZh(n)+'」是数字几?',say:numZh(n)+',是数字几?',vis:'<div class="chbig">'+numZh(n)+'</div>',
    hint:'想一想,'+numZh(n)+'个苹果,是几个?',meta:{type:'dzh',ans:n},key:'dz|'+n}));
}
function gDigNext(c){
  const R=c.R,mx=Math.max.apply(null,c.spec.knownDig.map(Number));if(mx<2)return null;
  const n=R.int(1,Math.min(mx,19)),ans=n+1;
  return mkChoice(c,numOpts(c,ans,0,Math.min(20,ans+4),{subject:'num',topic:'dnext',prompt:n+' 的后面是几?',say:n+'的后面是几?',vis:'<div class="seq"><b>'+n+'</b><b class="q">?</b></div>',
    hint:'数数歌:'+n+',接着数~',meta:{type:'dnext',n,ans},key:'dn|'+n}));
}
function gDigMissing(c){
  const R=c.R,mx=Math.max.apply(null,c.spec.knownDig.map(Number));if(mx<3)return null;
  const a=R.int(1,Math.min(mx,19)-1),ans=a+1,b=a+2;
  return mkChoice(c,numOpts(c,ans,0,Math.min(20,b+3),{subject:'num',topic:'dmiss',prompt:'补上缺的数',say:'补上缺的数',vis:'<div class="seq"><b>'+a+'</b><b class="q">?</b><b>'+b+'</b></div>',
    hint:'从 '+a+' 开始往后数~',meta:{type:'dmiss',a,b,ans},key:'dm|'+a}));
}
function gDigMatch(c){
  const R=c.R,list=R.shuffle(c.spec.knownDig.filter(d=>+d>=1&&+d<=9));if(list.length<3)return null;
  const set=list.slice(0,3),ps=set.map((d,i)=>({id:i,l:'<span class="cz">'+d+'</span>',r:'<span class="dotsr">'+DIGIT_EMO[+d].repeat(+d)+'</span>'}));
  return {kind:'match',subject:'num',topic:'dmatch',prompt:'连一连:数字和数量',say:'连一连,数字和数量是好朋友',pairs:R.shuffle(ps),key:'dmt|'+set.slice().sort().join(''),meta:{type:'dmatch',set}};
}
function gDigMirror(c){
  const R=c.R,d=digPick(c,x=>DIG_MIRROR.includes(x));if(!d)return null;
  const opts=R.shuffle([{k:'ok',h:'<span class="ltr">'+d+'</span>',ok:true},{k:'mir',h:'<span class="ltr mir">'+d+'</span>',ok:false}]);
  return {kind:'choice',subject:'num',topic:'dmir',prompt:'哪个「'+d+'」写对了?',say:'哪个'+numZh(+d)+'写对了?',vis:'',opts,cols:2,fixed:true,optCls:'opt-ltr',
    hint:'对一对笔顺:'+STROKES[d].n[0],meta:{type:'dmir',d},key:'dmr|'+d};
}
/* ---------- 数字关:数字卡 → 描数字 → 认数字小题 ---------- */
function blockDigit(c,n){
  const s=c.spec,items=[];
  const card=(s.type==='learn')?digCard(c):null;
  if(card&&!c.used.has(card.key)){c.used.add(card.key);items.push(card);}
  const tr=Math.max(1,Math.min(3,n-items.length-1,n>=5?3:2));
  // 优先描今天的新数字,再描要复习的
  const fresh=d=>!c.used.has('dt|'+d),order=[];s.newDig.filter(fresh).forEach(d=>order.push(d));
  let rest=c.R.shuffle(s.knownDig.filter(d=>!order.includes(d)&&fresh(d)));
  if(order.length+rest.length<tr)rest=rest.concat(s.knownDig.filter(d=>!order.includes(d)&&!rest.includes(d)));
  const wl=rest.map(d=>[d,digWeight(c,d)]);
  while(order.length<tr&&wl.length){const p=c.R.wpick(wl,x=>x[1])[0];order.push(p);wl.splice(wl.findIndex(x=>x[0]===p),1);}
  order.slice(0,tr).forEach(d=>{const it=gDigTrace(c,d);c.used.add(it.key);items.push(it);});
  const mx=Math.max.apply(null,s.knownDig.map(Number));
  const gens=[[gDigCount,3],[gDigZh,mx>=2?1:0],[gDigNext,mx>=2?1.4:0],[gDigMissing,mx>=3?1.6:0],[gDigMatch,mx>=4?1.3:0],[gDigMirror,1.1]].filter(x=>x[1]>0);
  fill(c,n-items.length,gens).forEach(x=>items.push(x));
  return items;
}

function contentDay(cur){return cur<=30?cur:29+(cur%2);}
function daySpec(day){
  const week=Math.min(5,Math.ceil(day/7)),dw=((day-1)%7)+1;
  const type=day>=29?(day===29?'review':'challenge'):(dw===6?'review':(dw===7?'challenge':'learn'));
  const knownInit=[],knownFin=[],knownChars=[];let newInit=[],newFin=[],newChars=[];
  for(let d=1;d<=day;d++){
    (INIT_NEW[d]||[]).forEach(x=>knownInit.push(x));
    (FIN_NEW[d]||[]).forEach(x=>knownFin.push(x));
    if(CHAR_PLAN[d])Array.from(CHAR_PLAN[d]).forEach(x=>knownChars.push(x));
  }
  newInit=INIT_NEW[day]||[];newFin=FIN_NEW[day]||[];newChars=CHAR_PLAN[day]?Array.from(CHAR_PLAN[day]):[];
  // 复习日: 复习本周新学内容
  let weekChars=[],weekInit=[],weekFin=[];
  if(type!=='learn'&&day<29){for(let d=(week-1)*7+1;d<=day;d++){weekInit=weekInit.concat(INIT_NEW[d]||[]);weekFin=weekFin.concat(FIN_NEW[d]||[]);if(CHAR_PLAN[d])weekChars=weekChars.concat(Array.from(CHAR_PLAN[d]));}}
  const topics=Object.keys(MATH_UNLOCK).filter(k=>MATH_UNLOCK[k]<=day);

  const ALL_U=LETTERS.map(x=>x.u);let knownLtr=[],weekLtr=[];
  for(let d=1;d<=day;d++)Array.from(LTR_NEW[d]||'').forEach(x=>knownLtr.push(x));
  if(day>=29)knownLtr=ALL_U.slice();
  const newLtr=day>=29?[]:Array.from(LTR_NEW[day]||''),reLtr=day>=29?[]:Array.from(LTR_RE[day]||'');
  if(type!=='learn'&&day<29){for(let d=(week-1)*7+1;d<=day;d++){weekLtr=weekLtr.concat(Array.from(LTR_NEW[d]||''),Array.from(LTR_RE[d]||''));}}
  if(day>=29)weekLtr=ALL_U.slice();
  // 写数字:已学、今天新学、今天重点再练的数字
  let knownDig=[];for(let d=1;d<=day;d++)(DIGIT_NEW[d]||[]).forEach(x=>knownDig.push(x));
  if(day>=29)knownDig=DIGIT_SETS.slice();
  const newDig=day>=29?[]:(DIGIT_NEW[day]||[]).slice(),reDig=day>=29?[]:(DIGIT_RE[day]||[]).slice();
  return {day,week,dw,type,knownDig,newDig,reDig,focus:(COURSE.mathFocus||{})[day]||[],week_name:WEEKS[week-1].name,title:OUTLINE[day-1],knownInit,knownFin,knownChars,newInit,newFin,newChars,weekChars,weekInit,weekFin,topics,knownLtr,newLtr,reLtr,weekLtr,
    poem:day>=29?-1:Math.min(3,week-1),habit:HABITS[day-1],tip:COURSE.tips[day-1]};
}
function makeCtx(cur,diff,idx,loop){
  const cday=contentDay(cur),spec=daySpec(cday);
  const R=makeRNG(['k',cur,loop||0,idx,diff].join('|'));
  const e=Math.max(1,Math.min(40,cday+(diff-1)*4+(spec.type==='challenge'?2:0)));
  const nopt=diff===0?3:(diff===1?(cday<=7?3:4):4);
  return {R,cur,cday,diff,idx,e,spec,nopt,used:new Set()};
}
function fill(c,n,gens){
  const out=[];let tries=0;
  while(out.length<n&&tries<80){
    tries++;
    const g=c.R.wpick(gens,x=>x[1]);let it=null;
    try{it=g[0](c);}catch(err){GEN_ERRORS.push(String(err&&err.stack||err));console.error('gen error',err);continue;}
    if(!it||c.used.has(it.key))continue;
    c.used.add(it.key);out.push(it);
  }
  return out;
}

function blockMath(c,n){
  const s=c.spec,d=c.cday,gens=[],items=[],focus=s.focus||[];
  s.topics.forEach(t=>{
    const age=d-MATH_UNLOCK[t];let w=1;
    if(s.type==='learn'){if(age===0)w=4;else if(age<=2)w=2.2;}
    else if(s.type==='challenge'){w=age>=6?1.8:1.2;}
    const core=MATH_CORE[t];
    if(core&&d>=6)w*=1+core*0.5; else if(!core&&d>=8)w*=0.55;      // 8 天以后,主线是加法
    if(focus.includes(t))w*=3;                                          // 当天的数学重点
    if(t==='tenplus'&&d>=9&&d<=24)w*=1.5;                              // 十加个位数多巩固
    MATH_GENS[t].forEach(g=>gens.push([g,w/MATH_GENS[t].length*(t==='count'&&d>8?0.5:1)]));
  });
  // 固定每天至少出一题的练习(见 MATH_FORCE_*)
  (COURSE.mathForce||[]).forEach(f=>{
    if(c.idx===f[3]&&d>=f[1]&&d<=f[2]&&s.topics.includes(f[0])&&items.length<n-1){
      for(let t=0;t<8;t++){const it=MATH_GENS[f[0]][0](c);if(!c.used.has(it.key)){c.used.add(it.key);items.push(it);break;}}
    }

function blockLogic(c,n){

  const out=[],rot=d%5;for(let k=0;k<rot;k++)seqList.push(seqList.shift());

const DEDUPE_PARTS=['math','digit','phonics','letter'];
function buildLevel(cur,diff,idx,count,loop){
  const plan=levelPlan(count),p=plan[Math.min(idx,plan.length-1)];
  const c=makeCtx(cur,diff,idx,loop);
  // 同一天里,前面的关出过的数学/写数字/拼读题,后面的关不再重复出
  if(p.parts.some(pt=>DEDUPE_PARTS.includes(pt[0]))){
    for(let j=0;j<idx&&j<plan.length;j++){
      const pj=plan[j];
      if(pj.parts.some(pt=>DEDUPE_PARTS.includes(pt[0]))){
        const cj=makeCtx(cur,diff,j,loop);
        pj.parts.forEach(pt=>{if(DEDUPE_PARTS.includes(pt[0]))BLOCKS[pt[0]](cj,pt[1]).forEach(it=>c.used.add(it.key));});
      }
    }
  }
  let items=[];
  p.parts.forEach(pt=>{items=items.concat(BLOCKS[pt[0]](c,pt[1]));});
  return {name:p.name,icon:p.icon,idx,items,total:plan.length};
}

      const st={};STAT_KEYS.forEach(s=>{const a=(r.st&&r.st[s])||[0,0];st[s]=[clampInt(a[0],0,9999,0),clampInt(a[1],0,9999,0)];});

const Sfx=(function(){

    win(){play(()=>{[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.22,'triangle',.2));});},

/* ================= 朗读 ================= */
const Tts=(function(){
  const ok=typeof window!=='undefined'&&'speechSynthesis' in window&&typeof window.SpeechSynthesisUtterance==='function';
  let voice=null,enVoice=null,seqTok=0;
  function pick(){if(!ok)return;try{const vs=window.speechSynthesis.getVoices()||[];
    voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;
    enVoice=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
  if(ok){pick();try{window.speechSynthesis.addEventListener('voiceschanged',pick);}catch(e){}}
  return {
    ok,
    hasZh(){return ok&&!!voice;},
    hasEn(){return ok&&!!enVoice;},
    // lang:'en' 读英文(en-US);force=true 表示孩子主动点了喇叭,即使关了"自动朗读"也读
    say(text,lang,force){
      if(!ok||(!force&&!S.voice)||!text)return false;
      try{const en=lang==='en',u=new window.SpeechSynthesisUtterance(String(text));
        u.lang=en?'en-US':'zh-CN';u.rate=en?.75:.85;u.pitch=en?1:1.1;const v=en?enVoice:voice;if(v)u.voice=v;
        seqTok++;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);return true;}catch(e){return false;}
    },
    // 按顺序读一串(每段可以有自己的停顿 pause,毫秒),用于自然拼读:字母名 → 停 1 秒 → 音 ×2 → "A says … as in apple"
    seq(steps,o){
      o=o||{};if(!ok||(!o.force&&!S.voice)||!steps||!steps.length)return false;
      try{window.speechSynthesis.cancel();}catch(e){}
      const tok=++seqTok;let i=0;
      const next=()=>{
        if(tok!==seqTok||i>=steps.length)return;const st=steps[i++];
        try{
          const u=new window.SpeechSynthesisUtterance(String(st.t));u.lang='en-US';u.rate=st.rate||o.rate||.55;u.pitch=1;if(enVoice)u.voice=enVoice;
          let fired=false;const go=()=>{if(fired)return;fired=true;if(tok!==seqTok)return;setTimeout(next,st.pause||0);};
          u.onend=go;u.onerror=go;
          setTimeout(go,2500+String(st.t).length*600/(u.rate||.5)); // 有的浏览器不触发 onend,兜底
          window.speechSynthesis.speak(u);
        }catch(e){}
      };
      next();return true;
    },
    stop(){seqTok++;if(ok){try{window.speechSynthesis.cancel();}catch(e){}}}
  };
})();

function startDay(day){

/* 自然拼读:发音卡 + 慢速拼读播放 */
function phonSteps(u,mode){
  const L=LTR_BY[u],P=phOf(u),slowRate=PHON_RATE.slow,rate=(mode==='slow'||S.slow)?slowRate:PHON_RATE.normal;
  const nm={rate:rate};
  if(mode==='full')return [
    {t:L.say,pause:PHON_PAUSE.afterName,rate},                       // 先读字母名,停 1 秒
    {t:P.tts,pause:PHON_PAUSE.afterSound,rate},{t:P.tts,pause:PHON_PAUSE.afterSound2,rate},   // 声音 ×2
    {t:L.say+' says',pause:PHON_PAUSE.mid,rate},{t:P.tts,pause:PHON_PAUSE.mid,rate},{t:'as in '+L.w,pause:0,rate}];
  return [{t:P.tts,pause:PHON_PAUSE.afterSound,rate},{t:P.tts,pause:PHON_PAUSE.afterSound2,rate},{t:'as in '+L.w,pause:0,rate}];
}
function playPhon(u,mode){
  if(!u||!phOf(u))return false;
  if(!Tts.ok){toast('这台设备没有朗读功能,请爸爸妈妈读给你听~');return false;}
  const steps=mode==='sound'?phonSteps(u,'x').slice(0,2):phonSteps(u,mode==='slow'?'slow':'full'===mode?'full':'x');
  const ok=Tts.seq(steps,{force:true});warnEn(ok);return ok;
}
function rPhon(qa,it){
  const u=it.u,L=LTR_BY[u],P=phOf(u);it.followed=it.followed||false;
  qa.innerHTML='<div class="qtop"><span class="chip en">英语</span></div><div class="prompt">'+esc(it.title)+(it.re?'<span class="retag">复习</span>':'')+'</div>'+

function polyPts(poly,step){
  const out=[];for(let i=0;i<poly.length-1;i++){const a=poly[i],b=poly[i+1],L=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(L/step));for(let k=0;k<n;k++)out.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]);}
  out.push(poly[poly.length-1]);return out;
}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}

  const g=polyPts(guide,3);let cov=0;for(const p of g){if(minDist(p,user)<=TR.tol)cov++;}cov/=g.length;
  let near=0;for(const p of user){if(minDist(p,g)<=TR.tol+6)near++;}near/=user.length;
  const sOK=dist(user[0],guide[0])<=TR.startTol,eOK=dist(user[user.length-1],guide[guide.length-1])<=TR.endTol;
  const ok=cov>=0.8&&near>=0.85&&sOK&&eOK;

}
function traceDraw(it){

    x.beginPath();poly.forEach((p,j)=>{if(j)x.lineTo(p[0]*k,p[1]*k);else x.moveTo(p[0]*k,p[1]*k);});

    const q=S0.p[it.si];const e2=q[q.length-1];x.fillStyle='#d94a4a';x.beginPath();x.arc(e2[0]*k,e2[1]*k,2.4*k,0,7);x.fill();}
  if(it.pts.length>1){x.strokeStyle='#2f7bff';x.lineWidth=7*k/6.8*1.1;x.beginPath();it.pts.forEach((p,j)=>{if(j)x.lineTo(p[0]*k,p[1]*k);else x.moveTo(p[0]*k,p[1]*k);});x.stroke();}
  const sn=$('#stn');if(sn)sn.textContent=it.done?'写好啦!':'第 '+(it.si+1)+' 笔:'+S0.n[it.si]+'(橙点开始,红点结束)';

function traceArrow(x,poly,k){            // 写数字:在当前这一笔上画一个小箭头,告诉孩子往哪个方向写
  let tot=0;for(let i=0;i<poly.length-1;i++)tot+=dist(poly[i],poly[i+1]);let want=tot*0.4,acc=0;
  for(let i=0;i<poly.length-1;i++){const a=poly[i],b=poly[i+1],L=dist(a,b);
    if(acc+L>=want&&L>0){const f=(want-acc)/L,px=a[0]+(b[0]-a[0])*f,py=a[1]+(b[1]-a[1])*f,ang=Math.atan2(b[1]-a[1],b[0]-a[0]),r=4.2*k;

  const n=chars.filter(c=>!/[，。！？、,.!? ]/.test(c)).length;

  chars.forEach(c=>{if(/[，。！？、,.!? ]/.test(c))h+=esc(c);else h+='<ruby>'+esc(c)+'<rt>'+esc(sy[k++])+'</rt></ruby>';});return h;
}
function rSay(qa,it){
  const sc=it.scene;
  qa.innerHTML='<div class="qtop"><span class="chip fun">小游戏</span>'+sayBtn(sc[1])+'</div><div class="prompt">看图说一说</div><div class="center"><div class="scene">'+sc[0]+'</div><div class="sent">'+sentRuby(sc[1],sc[2])+'</div></div>'+
   '<div class="small center" style="margin:10px 0">先自己说一说图里有什么,再点 🔊 听听,最后跟着读~</div><div class="bottombar"><button class="big grn" id="nx" data-act="next">说完啦 ➜</button></div>';
  speakAuto(sc[1]);
}
/* ---------- 过关 / 完成 ---------- */
function exitAsk(){
  modal('<div class="hero" style="font-size:70px">🏠</div><div class="h1">要先休息一下吗?</div><div class="small">这一关要重新开始哦,已经得到的星星会留着。</div><div class="row2"><button data-act="mclose">继续玩 ▶</button><button data-act="home" style="background:#ffe3c2">回首页</button></div>');
}
function finishLevel(){
  const rec=dayRec(run.cur);
  if(!run.practice){rec.lv=Math.max(rec.lv,run.idx+1);saveState();}
  addStarSilent(2);
  if(run.idx+1>=S.levels){finishDay();return;}
  const nxt=levelPlan(S.levels)[run.idx+1];Sfx.win();confetti(18);
  const pet=petInfo(S.stars);
  setScreen('rest','<div class="center"><div class="hero">'+pet.emoji+'</div><div class="h1">第 '+(run.idx+1)+' 关通过啦!</div><div class="pill" style="font-size:26px">⭐ +'+run.lvStars+'(含过关奖励)</div>'+
   '<div class="breath">😌</div><div class="rest">休息一下:'+esc(RESTS[(run.cur+run.idx)%RESTS.length])+'</div><div style="height:16px"></div>'+
   '<button class="big" id="nx" data-act="nextlevel">下一关:'+nxt.icon+' '+esc(nxt.name)+' ➜</button><div style="height:10px"></div><button data-act="home" style="min-height:56px;font-size:18px">先休息,回首页</button></div>');
  const nx=$('#nx');nx.disabled=true;later(()=>{nx.disabled=false;},600);
}
function addStarSilent(n){S.stars+=n;run.lvStars+=n;run.dayStars+=n;if(!run.practice)dayRec(run.cur).stars+=n;saveState();}
function pickSticker(cur){
  const N=STICKERS.length;for(let k=0;k<N;k++){const i=(cur-1+k)%N;if(!S.stickers.includes(i))return i;}return -1;
}
function finishDay(){
  const rec=dayRec(run.cur);let sticker=-1,first=false;
  if(!run.practice&&!rec.done){
    first=true;rec.done=true;rec.date=todayStr();rec.lv=S.levels;S.totalDays++;
    if(S.lastDone===yesterdayStr())S.streak++;else if(S.lastDone!==todayStr())S.streak=1;
    S.lastDone=todayStr();if(S.streak>S.best)S.best=S.streak;
    sticker=pickSticker(run.cur);if(sticker>=0)S.stickers.push(sticker);
    addStarSilent(5);
  }
  saveState();Sfx.win();confetti(40);
  const pet=petInfo(S.stars),grew=pet.i>run.petBefore;
  const st=dayRec(run.cur).st;let c=0,t=0;Object.keys(st).forEach(k=>{c+=st[k][0];t+=st[k][1];});
  setScreen('done','<div class="center">'+
   (sticker>=0?'<div class="stickerbig">'+STICKERS[sticker][0]+'</div><div class="pill">🎁 新贴纸:'+esc(STICKERS[sticker][1])+'</div>':'<div class="hero">🏆</div>')+
   '<div class="h1">'+(first?'今天的任务全部完成!':'又练了一遍,真棒!')+'</div>'+
   '<div class="card"><div class="theme">⭐ 今天得了 '+run.dayStars+' 颗星'+(first?'(含完成奖励 5 颗)':'')+'</div>'+(first?'<div class="theme">🔥 连续学习 '+S.streak+' 天</div>':'')+
   '<div class="theme">'+pet.emoji+' '+esc(pet.name)+(grew?' 长大啦!':'')+'</div></div>'+
   '<div class="rest">去告诉爸爸妈妈:今天你学会了什么?</div><div style="height:14px"></div><button class="big grn" data-act="home">回到首页 🏠</button></div>');
}
/* ---------- 家长区 ---------- */
let gateCb=null,gateAns=0;
function askGate(cb){
  gateCb=cb;const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);gateAns=a*b;
  modal('<div class="h1">🔒 家长专区</div><div class="small">请回答:</div><div class="eq" style="font-size:40px">'+a+' × '+b+' = ?</div><input id="gin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="答案"><div class="msg" id="gmsg"></div><div class="row2"><button data-act="mclose">取消</button><button data-act="gate-ok" style="background:var(--grn);color:#fff">确定</button></div>','top');
  setTimeout(()=>{const i=$('#gin');if(i){try{i.focus();}catch(e){}i.addEventListener('keydown',e=>{if(e.key==='Enter')gateCheck();});}},50);
}
function gateCheck(){
  const v=parseInt(($('#gin')||{}).value,10);
  if(v===gateAns){const cb=gateCb;gateCb=null;closeModal();if(cb)cb();}
  else{const m=$('#gmsg');if(m)m.textContent='不对哦,请家长再算一算';const i=$('#gin');if(i)i.value='';}
}
function aggStats(){const a={py:[0,0],zi:[0,0],poem:[0,0],math:[0,0],logic:[0,0],en:[0,0],num:[0,0]};Object.keys(S.days).forEach(d=>{const r=S.days[d];Object.keys(a).forEach(k=>{a[k][0]+=(r.st[k]||[0,0])[0];a[k][1]+=(r.st[k]||[0,0])[1];});});return a;}
function pct(a){return a[1]?Math.round(100*a[0]/a[1]):null;}
function showParent(msg){
  const ag=aggStats();let bars='';
  ['math','en','num','logic','py','zi','poem'].forEach(k=>{const p=pct(ag[k]);if(p===null&&(k==='py'||k==='zi'||k==='poem'))return;bars+='<div>'+SUBJ[k]+':'+(p===null?'还没有数据':p+'%('+ag[k][0]+'/'+ag[k][1]+')')+'</div><div class="bar"><i style="width:'+(p||0)+'%"></i></div>';});
  const cd=contentDay(S.cur),sp=daySpec(cd);
  let rows='';Object.keys(S.days).map(Number).sort((a,b)=>a-b).forEach(d=>{
    const r=S.days[d];if(!r.done&&!r.lv&&!r.stars)return;let c=0,t=0;Object.keys(r.st).forEach(k=>{c+=r.st[k][0];t+=r.st[k][1];});
    rows+='<tr><td>'+d+'</td><td>'+(r.done?'✅'+(r.date?' '+r.date.slice(5):''):'进行中 '+r.lv+'/'+S.levels)+'</td><td>⭐'+r.stars+'</td><td>'+(t?Math.round(100*c/t)+'%':'—')+'</td><td>'+(r.habit?'✓':'')+'</td></tr>';});
  if(!rows)rows='<tr><td colspan="5">还没有学习记录</td></tr>';
  const segD=['轻松','标准','挑战'].map((n,i)=>'<button class="'+(S.diff===i?'on':'')+'" data-act="set-diff" data-v="'+i+'">'+n+'</button>').join('');
  const segL=[3,4,5].map(n=>'<button class="'+(S.levels===n?'on':'')+'" data-act="set-lv" data-v="'+n+'">'+n+' 关<br><small>约'+n*4+'分钟</small></button>').join('');
  let opt='';for(let i=1;i<=30;i++)opt+='<option value="'+i+'"'+(i===Math.min(S.cur,30)?' selected':'')+'>第 '+i+' 天 · '+esc(OUTLINE[i-1].split('·')[0].trim())+'</option>';
  setScreen('parent','<div class="backrow"><button data-act="home">⬅</button><h2>👨‍👩‍👧 家长专区</h2></div>'+(msg?'<div class="card msg" style="font-size:18px">'+esc(msg)+'</div>':'')+
   '<div class="card pcard"><h3>💡 今天怎么用 2 分钟配合</h3>'+esc(sp.tip)+'<div class="small" style="margin-top:6px">今日小任务:'+esc(sp.habit)+'</div>'+
   '<button class="pbtn" data-act="phabit">'+(dayRec(S.cur).habit?'✅ 已打勾(点击取消)':'⬜ 孩子完成了,打勾')+'</button></div>'+
   '<div class="card pcard"><h3>📊 学习概况</h3>累计学习 <b>'+S.totalDays+'</b> 天 · 连续 <b>'+streakNow()+'</b> 天(最长 '+S.best+') · ⭐ '+S.stars+'<br>现在是第 <b>'+S.cur+'</b> 天:'+esc(cd<=30?OUTLINE[cd-1]:'毕业复习')+'<div style="height:8px"></div>'+bars+'<div class="small">正确率按「第一次就答对」统计,答错会再出现一次,不扣分。重玩的不统计。</div></div>'+
   '<div class="card pcard"><h3>📅 每天记录</h3><table class="tbl"><tr><th>天</th><th>状态</th><th>星星</th><th>正确率</th><th>小任务</th></tr>'+rows+'</table></div>'+
   '<div class="card pcard"><h3>⚙️ 设置</h3>起始难度<div class="seg">'+segD+'</div><div class="small">轻松:选项更少、数字更小;挑战:更多选项、更大数字。</div><div style="height:8px"></div>每天关卡数<div class="seg">'+segL+'</div><div style="height:8px"></div>'+
   '<button class="pbtn" data-act="set-sound">'+(S.sound?'🔔 音效:开':'🔕 音效:关')+'</button><button class="pbtn tts" data-act="set-voice">'+(S.voice?'🗣️ 自动朗读题目:开':'🤐 自动朗读题目:关')+'</button><button class="pbtn tts" data-act="set-ear">'+(S.ear?'👂 自然拼读小耳朵:开(字母卡显示首音)':'👂 自然拼读小耳朵:关')+'</button>'+
   '<div class="small ifnotts">这台设备的浏览器不支持朗读。</div><div class="small tts">朗读用的是手机自带的中文语音;没声音时,请在手机设置里安装/开启中文语音(如「文字转语音」)。字母朗读需要英文(美式)语音,没有的话请在系统「文字转语音」里添加。自然拼读是用手机的英文语音读单个声音(如 buh、kuh),可能不够标准:如果觉得手机读音不准,可家长示范;卡片上的 🐢「再慢一点」会把速度调得更慢;点 🔊 按钮不受「自动朗读」开关影响。</div><div style="height:8px"></div>'+
   '从第几天开始<select id="startday">'+opt+'</select><button class="pbtn" data-act="set-day">应用</button><div class="small">选好后,孩子就从那一天开始(已学完的记录保留)。</div></div>'+
   '<div class="card pcard"><h3>💾 备份与转移</h3><div class="small">换手机或清理浏览器前,复制下面的文字保存;到新设备里粘贴导入。</div><textarea id="exp" readonly>'+esc(JSON.stringify(S))+'</textarea><button class="pbtn" data-act="copy">📋 复制</button>'+
   '<div class="small" style="margin-top:8px">导入:把备份文字粘贴到这里</div><textarea id="imp" placeholder="在这里粘贴"></textarea><button class="pbtn" data-act="import">📥 导入</button><div class="msg" id="pmsg"></div>'+
   '<button class="pbtn" data-act="reset" style="background:#ffe3c2">🗑️ 清除所有进度</button></div>'+
   '<div class="card pcard"><h3>📱 放到手机桌面</h3>用浏览器打开本页后,点浏览器菜单 →「添加到主屏幕」,以后点图标就能玩。进度保存在这个浏览器里,清除浏览器数据会丢失,建议偶尔备份。</div>');
}
function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast('已复制'),()=>fallbackCopy());return;}}catch(e){}
  fallbackCopy();
}
function fallbackCopy(){const e=$('#exp');if(!e)return;e.focus();e.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}toast(ok?'已复制':'请长按文字手动复制');}
function doImport(){
  const t=($('#imp')||{}).value||'';let o;
  try{o=JSON.parse(t);}catch(e){const m=$('#pmsg');if(m)m.textContent='这段文字不是有效的备份,请重新复制。';return;}
  if(!o||typeof o!=='object'||o.v!==1){const m=$('#pmsg');if(m)m.textContent='备份格式不对。';return;}
  S=sanitize(o);S.assign=S.assign||todayStr();saveState();showParent('已导入,当前是第 '+S.cur+' 天。');
}
function doReset(){
  closeModal();S=defaultState();S.assign=todayStr();try{window.localStorage.removeItem(SKEY);}catch(e){}memStore=null;saveState();showHome();toast('已清除,重新开始');
}
/* ---------- 事件 ---------- */
document.addEventListener('pointerdown',()=>Sfx.unlock(),{passive:true});
app.addEventListener('click',onClick);
document.body.addEventListener('click',e=>{if(e.target.closest('#modal'))onClick(e);});
function onClick(e){
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const act=t.dataset.act,now=Date.now();
  if((act==='ans'||act==='gans'||act==='tile'||act==='ml'||act==='mr'||act==='flip')&&now-lastTap<180)return;lastTap=now;
  switch(act){
    case 'say':{const lg=t.dataset.lang||'',ok=Tts.say(t.dataset.t,lg,true);if(lg==='en')warnEn(ok);else if(!ttsWarned&&ok){ttsWarned=true;later(()=>{try{if(window.speechSynthesis.getVoices().length&&!Tts.hasZh())toast('没找到中文语音,可能没有声音。请在手机设置里安装中文语音',5000);}catch(x){}},600);}break;}
    case 'start':Sfx.tap();startDay(S.cur);break;
    case 'play':startDay(parseInt(t.dataset.d,10));break;
    case 'locked':toast('先完成前面的日子,才能解锁哦~');break;
    case 'home':closeModal();showHome();break;
    case 'map':showMap();break;
    case 'stickers':showStickers();break;
    case 'stk':{const i=parseInt(t.dataset.i,10);toast(S.stickers.includes(i)?STICKERS[i][0]+' '+STICKERS[i][1]:'每完成一天,就能得到一张新贴纸!');break;}
    case 'pet':{const p=$('#pet'),b=$('#bub');if(p){p.classList.remove('bounce');void p.offsetWidth;p.classList.add('bounce');}const m=rnd(BUBBLES);if(b)b.textContent=m;Sfx.ok();Tts.say(m);break;}
    case 'exit':exitAsk();break;
    case 'mclose':closeModal();break;
    case 'gans':actGans(parseInt(t.dataset.i,10));break;
    case 'en':{if(!Tts.ok){toast('这台设备没有朗读功能,请爸爸妈妈读给你听~');break;}t.classList.remove('tap');void t.offsetWidth;t.classList.add('tap');Sfx.tap();warnEn(Tts.say(t.dataset.t,'en',true));break;}
    case 'ear':{if(!Tts.ok){toast('这台设备没有朗读功能');break;}Sfx.tap();warnEn(Tts.say(t.dataset.t,'en',true));break;}
    case 'f-say':case 'f-again':actFollow('say');break;
    case 'f-next':actFollow('next');break;
    case 'phplay':playPhon(t.dataset.u,'sound');break;
    case 'ph-play':case 'ph-again':actPhon('play');break;
    case 'ph-slow':actPhon('slow');break;
    case 'ph-follow':actPhon('follow');break;
    case 'ans':actAns(parseInt(t.dataset.i,10));break;
    case 'ml':actMatch('l',parseInt(t.dataset.id,10));break;
    case 'mr':actMatch('r',parseInt(t.dataset.id,10));break;
    case 'tile':actTile(parseInt(t.dataset.v,10),t);break;
    case 'flip':actFlip(parseInt(t.dataset.i,10));break;
    case 'mv':actMv(t.dataset.d);break;
    case 'mcell':actMcell(parseInt(t.dataset.ci,10));break;
    case 'tr-redo':{const it=run&&run.it;if(it&&it.kind==='trace'&&!it.done){it.pts=[];traceDraw(it);}break;}
    case 'tr-skip':{const it=run&&run.it;if(it&&it.kind==='trace'&&!it.done){it.done=true;it.si=STROKES[it.ch].p.length;traceDraw(it);fb('下次再描吧~','ok');showNext();}break;}
    case 'lcard':{const it=run.it;const x=it.items[parseInt(t.dataset.i,10)];t.classList.remove('tap');void t.offsetWidth;t.classList.add('tap');Sfx.tap();Tts.say(x.say);break;}
    case 'next':Tts.stop();nextQ();break;
    case 'nextlevel':startLevel(run.idx+1);break;
    case 'habit':askGate(()=>{const r=dayRec(S.cur);r.habit=!r.habit;saveState();showHome();toast(r.habit?'已打勾 ✅':'已取消打勾');});break;
    case 'phabit':{const r=dayRec(S.cur);r.habit=!r.habit;saveState();showParent();break;}
    case 'parent':askGate(()=>showParent());break;
    case 'gate-ok':gateCheck();break;
    case 'set-diff':S.diff=parseInt(t.dataset.v,10);saveState();showParent();break;
    case 'set-lv':S.levels=parseInt(t.dataset.v,10);saveState();showParent();break;
    case 'set-sound':S.sound=!S.sound;saveState();if(S.sound)Sfx.ok();showParent();break;
    case 'set-ear':S.ear=!S.ear;saveState();showParent();break;
    case 'set-voice':S.voice=!S.voice;saveState();if(!S.voice)Tts.stop();showParent();break;
    case 'set-day':{const v=parseInt(($('#startday')||{}).value,10);if(v>=1&&v<=30){S.cur=v;S.assign=todayStr();saveState();showParent('已设置:从第 '+v+' 天开始。');}break;}
    case 'copy':copyText(JSON.stringify(S));break;
    case 'import':doImport();break;
    case 'reset':modal('<div class="hero" style="font-size:70px">🗑️</div><div class="h1">确定清除所有进度?</div><div class="small">星星、贴纸、记录都会删掉,不能恢复。</div><div class="row2"><button data-act="mclose">不清除</button><button data-act="reset-ok" style="background:var(--red);color:#fff">清除</button></div>');break;
    case 'reset-ok':doReset();break;
  }
}
/* ---------- 启动 ---------- */
function boot(){
  const m=/[?&]now=(\d{4})-(\d\d)-(\d\d)/.exec(location.search);
  if(m)FAKE_NOW=new Date(+m[1],+m[2]-1,+m[3],12,0,0);
  try{window.localStorage.setItem('__probe','1');window.localStorage.removeItem('__probe');}catch(e){storageOK=false;}
  if(!Tts.ok)document.body.classList.add('no-tts');
  document.addEventListener('visibilitychange',()=>{if(document.hidden)Tts.stop();});
  showHome();
}
window.KID={get S(){return S;},set S(v){S=v;},get run(){return run;},buildLevel,daySpec,contentDay,GEN_ERRORS,sanitize,defaultState,saveState,showHome,showParent,ensureToday,setNow(d){FAKE_NOW=d?new Date(d+'T12:00:00'):null;},get storageOK(){return storageOK;}};
boot();


</script>
